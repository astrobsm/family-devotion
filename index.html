<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b2a86" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1622" media="(prefers-color-scheme: dark)">
<meta name="description" content="Morning and night family devotions, one virtue a week.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Devotion">
<title>Family Devotion</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <button class="icon-btn" id="back" aria-label="Back" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <div class="topbar-title" id="title">Family Devotion</div>
  <button class="icon-btn" id="textsize" aria-label="Text size">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18L9 6l5 12M5.6 14h6.8M15 18l3-7 3 7M15.9 16h4.2"/></svg>
  </button>
  <a class="icon-btn" href="#/more" aria-label="Settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
  </a>
</header>

<main id="view" tabindex="-1"><p class="loading">Loading…</p></main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<nav class="tabbar" aria-label="Main">
  <a href="#/today" data-tab="today">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span>Today</span></a>
  <a href="#/week" data-tab="week">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    <span>This week</span></a>
  <a href="#/year" data-tab="year">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    <span>All weeks</span></a>
  <a href="#/prayers" data-tab="prayers">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M7 8h10"/></svg>
    <span>Prayers</span></a>
</nav>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
